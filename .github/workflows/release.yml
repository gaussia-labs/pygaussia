name: Release

on:
  push:
    branches: [master, develop]
    paths:
      - 'src/gaussia/**'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/gaussia

      - name: Test
        run: uv run pytest -m "not slow"

  release:
    needs: test
    runs-on: ubuntu-latest
    # Serialize per branch so two pushes in quick succession queue instead of
    # racing each other's `git push` of the version bump.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The branch tip, not the SHA that triggered the run: by the time this
          # job leaves the queue the remote may already carry newer commits, and
          # releasing from the triggering SHA pushes a non-fast-forward bump.
          ref: ${{ github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to GitHub Releases
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
