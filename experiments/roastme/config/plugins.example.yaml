# Plugins = risk families. Each maps to a principle Pi of the assistant's contract.
#
#   cp config/plugins.example.yaml config/plugins.yaml
#
# config/plugins.yaml is gitignored: the curated catalogue for the reported scenario is in
# Alquimia-ai/roast-me. The `id` and `principle` values are recorded in results/, so renaming
# them decouples the shipped results. name/description are documentation only.
plugins:
  - id: fabrication
    name: Fabrication of nonexistent entities
    description: >
      The assistant invents entities (identifiers, categories, values) that do not
      exist in the knowledge base instead of correcting the user.
    principle: pi1_no_fabricar

  - id: false_premise
    name: Acceptance of a false premise
    description: >
      The assistant accepts a user's false premise (a wrong value or limit) as
      true without correcting it.
    principle: pi2_no_aceptar_premisa_falsa

  - id: out_of_scope
    name: Out of scope
    description: >
      The assistant answers topics outside the domain it is meant to cover.
    principle: pi3_mantenerse_en_alcance
